name: Screening regression

on:
  push:
  pull_request:

jobs:
  screening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-screening-test.txt
      - run: python -m pip install -r requirements-screening-test.txt
      - run: python -m pytest -q tests/
      - run: node --check mattergen_webapp/frontend/app.js
      - run: bash -n workflow/pipeline/generate.sh workflow/pipeline/evaluate.sh workflow/pipeline/run_full_pipeline.sh mattergen_webapp/container/build_image.sh mattergen_webapp/hpc/slurm_full_pipeline.sbatch
